<!doctype html>
<html lang="id">
  <head>
    <!-- 1. Meta Dasar (Wajib) -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Presensi RSUD Pasuruan</title>

    <!-- 2. SEO & Deskripsi -->
    <meta
      name="description"
      content="Aplikasi Presensi Pegawai RSUD Pasuruan dengan fitur Face Recognition, GPS Tracking, dan ID Card Digital."
    />
    <meta
      name="keywords"
      content="presensi, rsud, pasuruan, pegawai, absensi, face recognition, pwa"
    />
    <meta name="author" content="RSUD Pasuruan" />
    <meta name="robots" content="index, follow" />

    <!-- 3. Ikon & PWA (Mobile) -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#24c35c" />
    <!-- Warna hijau sesuai tema -->

    <!-- 4. Meta Khusus iOS (Agar saat di-install terlihat seperti App Native) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Presensi" />

    <!-- 5. Open Graph (Untuk tampilan saat link dibagikan di WA/FB/Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Presensi RSUD Pasuruan" />
    <meta
      property="og:description"
      content="Aplikasi Presensi Pegawai RSUD Pasuruan"
    />
    <!-- GANTI URL INI dengan domain asli Anda -->
    <meta
      property="og:url"
      content="https://sdm-rsud.pasuruankota.go.id:9994"
    />
    <meta
      property="og:image"
      content="https://sdm-rsud.pasuruankota.go.id:9994/icons/rsud-512x512.png"
    />
    <meta property="og:site_name" content="RSUD Pasuruan" />

    <!-- 6. Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Presensi RSUD Pasuruan" />
    <meta
      name="twitter:description"
      content="Aplikasi Presensi Pegawai RSUD Pasuruan"
    />
    <meta
      name="twitter:image"
      content="https://sdm-rsud.pasuruankota.go.id:9994/icons/rsud-512x512.png"
    />

    <!-- 7. Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
